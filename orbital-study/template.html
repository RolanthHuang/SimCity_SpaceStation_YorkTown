<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="yorktown-prototype" content="orbital-closeup-0.1.1"><title>Yorktown · 遠航巨構近景樣板</title><style>/*STYLE*/</style></head><body>
<main><div id="host"></div>
<header><div class="brand"><span class="mark">Y</span><div><b>YORKTOWN</b><small>FIRST LIGHT / ORBITAL STUDY</small></div></div><nav aria-label="取景模式"><button data-view="street" aria-pressed="false">街道</button><button data-view="fly" aria-pressed="false">飛行近景</button><button data-view="overview" aria-pressed="true">全景</button></nav><span class="tag">實際 3D 樣板 · 01.1</span></header>
<div class="objects" aria-label="觀賞物件"><button data-object="ship" aria-pressed="true">星冠級旗艦</button><button data-object="relay" aria-pressed="false">遠航中繼巨構</button></div>
<section class="caption"><span id="eyebrow">HORIZON / NX–2263</span><h1 id="title">一座城市，迎接遠航。</h1><p id="description">星冠級旗艦停泊於晨光港。分層船殼、機庫與補給構造，皆為可旋轉觀察的實際模型。</p><div class="actions"><button id="detail">近看引擎</button><button id="hull-detail">船殼細節</button><button id="bay-detail">近看機庫</button><button id="arrival">播放訪港</button><button id="charge">中繼充能</button><button id="photo" title="輸出目前實際三維模型的取景">拍照</button></div></section>
<footer><span id="hint">拖曳旋轉 · 滾輪縮放 · 方向鍵轉向 · 右拖平移</span><span id="status" role="status" aria-live="polite">準備晨光港…</span><button id="reset" title="回到目前物件的安全取景">回到取景</button></footer>
<dialog id="capture"><div class="dialog-head"><b>實際模型取景</b><button id="close-capture" aria-label="關閉照片">×</button></div><img id="capture-image" alt="Yorktown 遠航樣板實際三維取景"><a id="download" download>下載 PNG</a></dialog>
<div id="failure" hidden><h2>未能啟動三維樣板</h2><p id="failure-message"></p><p>請使用支援 WebGL2 的瀏覽器重新開啟。</p></div>
</main><script>/*SCRIPT*/</script></body></html>
